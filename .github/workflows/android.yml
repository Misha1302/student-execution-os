name: android

on:
  push:
    paths:
      - 'mobile/**'
      - 'src/student_execution_os/web/static/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/student_execution_os/web/static/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Default API server preset in the app (e.g. https://plan.example.com); empty = ask on first launch'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Sync web client into the Android project
        env:
          SEOS_SERVER_URL: ${{ github.event.inputs.server_url }}
        run: npm run sync
      - name: Build debug APK
        env:
          SEOS_VERSION_CODE: ${{ github.run_number }}
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: execution-os-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Native unit tests and lint
        run: cd android && ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain
      - name: Release-like build with a throwaway key, verified and scanned for credentials
        run: |
          # No production credential exists in this job: a one-day key is generated here,
          # and its password doubles as a canary that must not end up in the APK.
          canary="seos-ci-$(openssl rand -hex 12)"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ci-release.jks" -alias ci -keyalg RSA \
            -keysize 2048 -validity 1 -storepass "$canary" -keypass "$canary" -dname "CN=botay CI throwaway"
          # Synthetic Firebase client config (no real project) so push is compiled in the
          # same way android-release.yml does it with the owner's real file.
          cat > android/app/google-services.json <<'JSON'
          {"project_info": {"project_number": "000000000000", "project_id": "seos-ci-synthetic",
            "storage_bucket": "seos-ci-synthetic.appspot.com"},
           "client": [{"client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000",
             "android_client_info": {"package_name": "io.github.misha1302.seos"}},
             "oauth_client": [], "api_key": [{"current_key": "ci-synthetic-not-a-key"}],
             "services": {"appinvite_service": {"other_platform_oauth_client": []}}}],
           "configuration_version": "1"}
          JSON
          cd android
          SEOS_KEYSTORE="$RUNNER_TEMP/ci-release.jks" SEOS_KEY_ALIAS=ci \
          SEOS_KEYSTORE_PASSWORD="$canary" SEOS_KEY_PASSWORD="$canary" \
          SEOS_VERSION_NAME="0.0.0-ci.${{ github.run_number }}" SEOS_VERSION_CODE="${{ github.run_number }}" \
            ./gradlew assembleRelease --no-daemon --console=plain
          rm app/google-services.json
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          python3 ../scripts/release_evidence.py app/build/outputs/apk/release/app-release.apk \
            --build-tools "$tools" --output "$RUNNER_TEMP/provenance.json" --require-fcm --require-clean \
            --expect-version-name "0.0.0-ci.${{ github.run_number }}" \
            --expect-version-code "${{ github.run_number }}" --canary "$canary"
          python3 ../scripts/apk_secret_scan.py app/build/outputs/apk/debug/app-debug.apk

  device:
    # Real Android system (emulator): notification buttons against a real server,
    # instrumented device tests, and the install / upgrade / update-trust path.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install server and web client
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix mobile
          npm run sync --prefix mobile
      - name: Build upgrade test APKs (old, new, foreign-signed)
        run: |
          cd mobile/android
          SEOS_VERSION_CODE=100 ./gradlew assembleDebug --no-daemon --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/old.apk"
          SEOS_VERSION_CODE=101 ./gradlew assembleDebug --no-daemon --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/new.apk"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/foreign.jks" -alias foreign -keyalg RSA \
            -keysize 2048 -validity 1 -storepass foreign-pass -keypass foreign-pass -dname "CN=not the publisher"
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" sign --ks "$RUNNER_TEMP/foreign.jks" --ks-pass pass:foreign-pass --out "$RUNNER_TEMP/foreign.apk" \
            "$RUNNER_TEMP/new.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start emulator
        timeout-minutes: 15
        run: mobile/scripts/ci_emulator.sh
      - name: Notification buttons end to end against a real server
        timeout-minutes: 15
        run: python mobile/scripts/native_e2e.py
      - name: Instrumented device tests (wake alarm, update trust)
        timeout-minutes: 15
        run: |
          cd mobile/android
          ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain \
            -Pandroid.testInstrumentationRunnerArguments.notClass=io.github.misha1302.seos.reminders.ReminderNotificationEndToEndTest
      - name: Install, offline start, upgrade, downgrade refusal, foreign-key refusal
        timeout-minutes: 10
        run: python mobile/scripts/install_upgrade_check.py "$RUNNER_TEMP/old.apk" "$RUNNER_TEMP/new.apk" "$RUNNER_TEMP/foreign.apk"
      - name: Diagnostics on failure
        if: failure() || cancelled()
        timeout-minutes: 3
        run: |
          # adb waits forever for a device; the emulator may never have come up.
          timeout 60 "$ANDROID_HOME/platform-tools/adb" logcat -d > "$RUNNER_TEMP/logcat.txt" 2>&1 || true
          tail -80 "$RUNNER_TEMP/emulator.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/emulator-copy.log" 2>/dev/null || true
      - name: Upload diagnostics
        if: failure() || cancelled()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: device-diagnostics
          path: |
            ${{ runner.temp }}/logcat.txt
            ${{ runner.temp }}/emulator.log
            mobile/android/app/build/reports/androidTests/
          if-no-files-found: ignore

