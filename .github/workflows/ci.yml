name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore dependencies
        run: echo "No third-party runtime dependencies."
      - name: Static compile check
        run: |
          set -o pipefail
          python -m compileall -q src tests 2>&1 | tee compile.log
      - name: Unit, integration, and acceptance tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee tests.log
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics
          path: |
            compile.log
            tests.log
          if-no-files-found: ignore
      - name: Health smoke
        run: python -m student_execution_os health
      - name: Canonical-domain SQLite smoke
        run: python -m student_execution_os domain-smoke
      - name: Planning feasibility smoke
        run: python -m student_execution_os feasibility-smoke
      - name: Planner vertical-slice smoke
        run: python -m student_execution_os planner-smoke
