name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore dependencies
        run: echo "No third-party runtime dependencies."
      - name: Static compile check
        id: compile
        continue-on-error: true
        run: python -m compileall -q src tests > compile.log 2>&1
      - name: Publish compile diagnostic
        if: steps.compile.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msg="$(head -n 2 compile.log | tr '\n' ' ' | cut -c1-130)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             -f state=error -f context=debug/compile -f description="$msg"
      - name: Stop on compile failure
        if: steps.compile.outcome == 'failure'
        run: exit 1
      - name: Unit, integration, and acceptance tests
        id: tests
        continue-on-error: true
        run: python -m unittest discover -s tests -p 'test_*.py' -v > tests.log 2>&1
      - name: Publish test diagnostic
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msg="$(tail -n 4 tests.log | tr '\n' ' ' | cut -c1-130)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             -f state=error -f context=debug/tests -f description="$msg"
      - name: Stop on test failure
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - name: Health smoke
        run: python -m student_execution_os health
      - name: Canonical-domain SQLite smoke
        run: python -m student_execution_os domain-smoke
      - name: Planning feasibility smoke
        run: python -m student_execution_os feasibility-smoke
      - name: Planner vertical-slice smoke
        run: python -m student_execution_os planner-smoke
