name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install browser for UI QA
        run: python -m playwright install --with-deps chromium
      - name: Static compile and JS syntax check
        run: make static
      - name: Unit, integration and acceptance tests
        run: make test
      - name: Web API tests
        run: make api
      - name: Chromium desktop/mobile UI tests
        run: make browser
      - name: Health smoke
        run: python -m student_execution_os health
      - name: Canonical-domain SQLite smoke
        run: python -m student_execution_os domain-smoke
      - name: Planning feasibility smoke
        run: python -m student_execution_os feasibility-smoke
      - name: Planner vertical-slice smoke
        run: python -m student_execution_os planner-smoke
      - name: Evidence reconciliation smoke
        run: python -m student_execution_os reconciliation-smoke
      - name: Google Calendar connector smoke
        run: python -m student_execution_os connector-smoke
      - name: LLM action boundary smoke
        run: python -m student_execution_os agent-smoke
      - name: Travel-aware planning smoke
        run: python -m student_execution_os travel-smoke
      - name: Recurrence and notification smoke
        run: python -m student_execution_os recurrence-notification-smoke
      - name: Web host smoke
        run: python -m student_execution_os.web.server --help >/dev/null
