# Deployment on a host where nginx already terminates TLS.
# Run from a release checkout with:
#   docker compose -p student-execution-os -f deploy/docker-compose.nginx.yml \
#     --env-file /etc/student-execution-os/student-execution-os.env up -d --build
services:
  api:
    image: student-execution-os:${SEOS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      SEOS_REVISION: ${SEOS_REVISION:-unknown}
      SEOS_REGISTRATION: ${SEOS_REGISTRATION:-open}
      SEOS_PROXY_HEADERS: ${SEOS_PROXY_HEADERS:-1}
      SEOS_FORWARDED_ALLOW_IPS: ${SEOS_FORWARDED_ALLOW_IPS:-127.0.0.1}
      SEOS_CORS_ORIGINS: ${SEOS_CORS_ORIGINS:-}
      SEOS_LLM_PROVIDER: ${SEOS_LLM_PROVIDER:-}
      SEOS_LLM_MODEL: ${SEOS_LLM_MODEL:-}
      SEOS_LLM_BASE_URL: ${SEOS_LLM_BASE_URL:-}
      SEOS_LLM_API_KEY: ${SEOS_LLM_API_KEY:-}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - /var/lib/student-execution-os:/data
      - /var/backups/student-execution-os:/backups

  reminder-worker:
    image: student-execution-os:${SEOS_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    command: ["python", "-m", "student_execution_os.reminders.worker", "--database", "/data/student-execution-os.db"]
    environment:
      SEOS_REVISION: ${SEOS_REVISION:-unknown}
      SEOS_FCM_SERVICE_ACCOUNT_JSON: ${SEOS_FCM_SERVICE_ACCOUNT_JSON:-}
      SEOS_FCM_SERVICE_ACCOUNT_FILE: ${SEOS_FCM_SERVICE_ACCOUNT_FILE:-}
    volumes:
      - /var/lib/student-execution-os:/data
