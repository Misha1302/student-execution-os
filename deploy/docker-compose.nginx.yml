# Deployment on a host where nginx already terminates TLS.
# Run from a release checkout with:
#   docker compose -p student-execution-os -f deploy/docker-compose.nginx.yml \
#     --env-file /etc/student-execution-os/student-execution-os.env up -d --build
services:
  api:
    image: student-execution-os:${SEOS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      SEOS_REVISION: ${SEOS_REVISION:-unknown}
      SEOS_REGISTRATION: ${SEOS_REGISTRATION:-open}
      SEOS_PROXY_HEADERS: ${SEOS_PROXY_HEADERS:-1}
      SEOS_FORWARDED_ALLOW_IPS: ${SEOS_FORWARDED_ALLOW_IPS:-127.0.0.1}
      SEOS_CORS_ORIGINS: ${SEOS_CORS_ORIGINS:-}
      # Master key that encrypts every account's own AI key (BYOK). Read from a file
      # in the API-only secret directory; never an image layer or the repository.
      SEOS_CREDENTIAL_KEY_FILE: ${SEOS_CREDENTIAL_KEY_FILE:-/run/secrets/seos/credential.key}
      # Optional operator credentials for the future paid tier; used only for
      # accounts with a PLATFORM_MANAGED entitlement, never as everybody's default.
      SEOS_PLATFORM_LLM_PROVIDER: ${SEOS_PLATFORM_LLM_PROVIDER:-}
      SEOS_PLATFORM_LLM_MODEL: ${SEOS_PLATFORM_LLM_MODEL:-}
      SEOS_PLATFORM_LLM_BASE_URL: ${SEOS_PLATFORM_LLM_BASE_URL:-}
      SEOS_PLATFORM_LLM_API_KEY: ${SEOS_PLATFORM_LLM_API_KEY:-}
      # Optional LLM-only egress route for providers that reject this VPS network.
      # Prefer *_FILE when the proxy URL contains credentials.
      SEOS_LLM_EGRESS_PROXY: ${SEOS_LLM_EGRESS_PROXY:-}
      SEOS_LLM_EGRESS_PROXY_FILE: ${SEOS_LLM_EGRESS_PROXY_FILE:-}
      SEOS_LLM_EGRESS_PROXY_HOSTS: ${SEOS_LLM_EGRESS_PROXY_HOSTS:-}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - /var/lib/student-execution-os:/data
      - /var/backups/student-execution-os:/backups
      - /etc/student-execution-os/secrets/api:/run/secrets/seos:ro

  reminder-worker:
    image: student-execution-os:${SEOS_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    command: ["python", "-m", "student_execution_os.reminders.worker", "--database", "/data/student-execution-os.db"]
    healthcheck:
      # The image's default check probes the API port; the worker has none.
      test: ["CMD", "python", "-m", "student_execution_os.reminders.worker", "--database", "/data/student-execution-os.db", "--check-heartbeat"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      SEOS_REVISION: ${SEOS_REVISION:-unknown}
      SEOS_FCM_SERVICE_ACCOUNT_JSON: ${SEOS_FCM_SERVICE_ACCOUNT_JSON:-}
      # The FCM service account lives in the worker-only secret directory.
      SEOS_FCM_SERVICE_ACCOUNT_FILE: ${SEOS_FCM_SERVICE_ACCOUNT_FILE:-/run/secrets/seos/fcm-service-account.json}
    volumes:
      - /var/lib/student-execution-os:/data
      - /etc/student-execution-os/secrets/worker:/run/secrets/seos:ro
