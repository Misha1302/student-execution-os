# Production-style deployment: the API behind Caddy with automatic HTTPS.
#   cp deploy/.env.example deploy/.env   # set SEOS_DOMAIN
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      SEOS_REGISTRATION: ${SEOS_REGISTRATION:-open}
      SEOS_PROXY_HEADERS: "1"
      SEOS_FORWARDED_ALLOW_IPS: "*"
      SEOS_CORS_ORIGINS: ${SEOS_CORS_ORIGINS:-}
      SEOS_FCM_ENDPOINT: ${SEOS_FCM_ENDPOINT:-}
      SEOS_FCM_BEARER_TOKEN: ${SEOS_FCM_BEARER_TOKEN:-}
    volumes:
      - seos-data:/data
    expose:
      - "8765"

  notification-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    command: ["python", "-m", "student_execution_os.notifications.worker", "--database", "/data/student-execution-os.db"]
    environment:
      SEOS_FCM_ENDPOINT: ${SEOS_FCM_ENDPOINT:-}
      SEOS_FCM_BEARER_TOKEN: ${SEOS_FCM_BEARER_TOKEN:-}
    volumes:
      - seos-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SEOS_DOMAIN: ${SEOS_DOMAIN:?set SEOS_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  seos-data:
  caddy-data:
  caddy-config:
