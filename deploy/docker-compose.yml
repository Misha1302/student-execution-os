# Production-style deployment: the API behind Caddy with automatic HTTPS.
#   cp deploy/.env.example deploy/.env   # set SEOS_DOMAIN
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      SEOS_REVISION: ${SEOS_REVISION:-unknown}
      SEOS_REGISTRATION: ${SEOS_REGISTRATION:-open}
      SEOS_PROXY_HEADERS: "1"
      SEOS_FORWARDED_ALLOW_IPS: "*"
      SEOS_CORS_ORIGINS: ${SEOS_CORS_ORIGINS:-}
      SEOS_CREDENTIAL_KEY_FILE: /run/secrets/seos/credential.key
      SEOS_PLATFORM_LLM_PROVIDER: ${SEOS_PLATFORM_LLM_PROVIDER:-}
      SEOS_PLATFORM_LLM_MODEL: ${SEOS_PLATFORM_LLM_MODEL:-}
      SEOS_PLATFORM_LLM_BASE_URL: ${SEOS_PLATFORM_LLM_BASE_URL:-}
      SEOS_PLATFORM_LLM_API_KEY: ${SEOS_PLATFORM_LLM_API_KEY:-}
    volumes:
      - seos-data:/data
      # deploy/secrets/ is git-ignored; see deploy/README.md "Secrets".
      - ./secrets/api:/run/secrets/seos:ro
    expose:
      - "8765"

  reminder-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    command: ["python", "-m", "student_execution_os.reminders.worker", "--database", "/data/student-execution-os.db"]
    healthcheck:
      # The image's default check probes the API port; the worker has none.
      test: ["CMD", "python", "-m", "student_execution_os.reminders.worker", "--database", "/data/student-execution-os.db", "--check-heartbeat"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      SEOS_REVISION: ${SEOS_REVISION:-unknown}
      SEOS_FCM_SERVICE_ACCOUNT_JSON: ${SEOS_FCM_SERVICE_ACCOUNT_JSON:-}
      SEOS_FCM_SERVICE_ACCOUNT_FILE: /run/secrets/seos/fcm-service-account.json
    volumes:
      - seos-data:/data
      - ./secrets/worker:/run/secrets/seos:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SEOS_DOMAIN: ${SEOS_DOMAIN:?set SEOS_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  seos-data:
  caddy-data:
  caddy-config:
