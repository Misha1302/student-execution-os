server {
    listen 80;
    listen [::]:80;
    server_name seos.185-102-139-43.sslip.io;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seos.185-102-139-43.sslip.io;

    ssl_certificate /etc/letsencrypt/live/seos.185-102-139-43.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seos.185-102-139-43.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
