<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f9">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https: http:; object-src 'none'; base-uri 'self'">
  <title>Execution OS</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/config.js"></script>
</head>
<body>
  <div id="ptr" class="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></div>

  <div class="app">
    <nav id="tabbar" class="tabbar" aria-label="Navigation"></nav>

    <div class="main-column">
      <header class="appbar">
        <button id="back-button" class="icon-button" hidden><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
        <div class="appbar-titles">
          <h1 id="page-title">Execution OS</h1>
          <p id="page-subtitle" class="appbar-subtitle" hidden></p>
        </div>
        <button id="offline-chip" type="button" class="chip chip-warn" data-action="sync-status" hidden></button>
        <button id="refresh-button" class="icon-button"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      </header>
      <main id="workspace" class="workspace" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
